name: Poems Explanations Scraper

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: 

jobs:
  scrape-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Scraper
        continue-on-error: true 
        timeout-minutes: 205
        run: node scrapPoemsExplanations/scrapPoemsExplanations.js 

      - name: Commit and Push generated JSON files
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add seedData/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update scraped explanations [skip ci]" && git push)
